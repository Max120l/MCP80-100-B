# Greaseweazle disk definition: IBM 3740 single density on both sides,
# for testing a double-sided 8" drive (Shugart SA850). Same track layout
# as the built-in dec.rx01, with two heads.
disk rx01ds
    cyls = 77
    heads = 2
    tracks * ibm.fm
        secs = 26
        bps = 128
        gap3 = 26
        rate = 250
        rpm = 360
    end
end
